<!doctype html>
<html lang="eu">
  <head>
    <meta charset="utf-8" />
    <title>Ikasbide</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#faf7f2" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Votre compagnon pour apprendre et pratiquer le basque à votre rythme."
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      (() => {
        let mode = 'system';
        try {
          const saved = localStorage.getItem('ikasbide.display-mode');
          if (saved === 'light' || saved === 'dark') mode = saved;
        } catch {}

        const preference = window.matchMedia('(prefers-color-scheme: dark)');
        const apply = () => {
          const effectiveMode = mode === 'system' ? (preference.matches ? 'dark' : 'light') : mode;
          document.documentElement.dataset.displayMode = effectiveMode;
          document.documentElement.style.colorScheme = effectiveMode;
          document
            .querySelector('meta[name="color-scheme"]')
            ?.setAttribute('content', effectiveMode);
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', effectiveMode === 'dark' ? '#202124' : '#faf7f2');
        };
        apply();
        preference.addEventListener('change', () => {
          if (mode === 'system') apply();
        });
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      <span lang="eu">Aktibatu JavaScript Ikasbide erabiltzeko.</span><br />
      <small lang="fr">Activez JavaScript pour utiliser Ikasbide.</small>
    </noscript>
  </body>
</html>
